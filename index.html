<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moyenne + Save</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    color:#00bfff;
}

.box{
    background:#1e1e1e;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

h3{
    color:#ffd700;
    text-align:center;
}

h2{
    color:#00ffcc;
}

input{
    width:90px;
    padding:8px;
    margin:5px;
    border:none;
    border-radius:8px;
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00bfff;
    color:white;
    font-size:20px;
    cursor:pointer;
    margin-top:10px;
}

#result{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    color:#00ff99;
    line-height:1.8;
}
</style>
</head>

<body>

<h1>Moyenne Annuelle</h1>

<!-- S1 -->
<div class="box">
<h3>S1</h3>

<h2>Algorithmique 1</h2>
<input id="algo1Cours"><input id="algo1Td"><input id="algo1Tp">

<h2>Analyse 1</h2>
<input id="an1Cours"><input id="an1Td">

<h2>Algèbre 1</h2>
<input id="alg1Cours"><input id="alg1Td">

<h2>SM1</h2>
<input id="sm1Cours"><input id="sm1Td">

<h2>Électricité</h2>
<input id="elec1Cours"><input id="elec1Td">

<h2>Logiciels Libres</h2>
<input id="llCours">

<h2>English</h2>
<input id="engCours">

</div>

<!-- S2 -->
<div class="box">
<h3>S2</h3>

<h2>ASD 2</h2>
<input id="asdCours"><input id="asdTd"><input id="asdTp">

<h2>Analyse 2</h2>
<input id="anCours"><input id="anTd">

<h2>Algèbre 2</h2>
<input id="algCours"><input id="algTd">

<h2>SM2</h2>
<input id="smCours"><input id="smTd">

<h2>Électronique</h2>
<input id="elecCours"><input id="elecTd">

<h2>Logique</h2>
<input id="logCours"><input id="logTd">

<h2>AI</h2>
<input id="aiCours"><input id="aiTp">

</div>

<button onclick="calculer()">Calculer</button>
<button onclick="saveData()">💾 Sauvegarder</button>
<button onclick="loadData()">📂 Charger</button>

<div id="result"></div>

<script>

function calc3(c, t, p){
    c = parseFloat(c)||0;
    t = parseFloat(t)||0;
    p = parseFloat(p)||0;

    if(p && t){
        return c*0.6 + t*0.2 + p*0.2;
    }
    if(p && !t){
        return c*0.6 + p*0.4;
    }
    return c*0.6 + t*0.4;
}

// ================= CALCUL =================
function calculer(){

// S1
let algo1 = calc3(algo1Cours.value, algo1Td.value, algo1Tp.value) * 5;
let an1 = calc3(an1Cours.value, an1Td.value, 0) * 4;
let alg1 = calc3(alg1Cours.value, alg1Td.value, 0) * 2;
let sm1 = calc3(sm1Cours.value, sm1Td.value, 0) * 3;
let elec1 = calc3(elec1Cours.value, elec1Td.value, 0) * 2;
let ll = (parseFloat(llCours.value)||0) * 1;
let eng = (parseFloat(engCours.value)||0) * 1;

let moyS1 = (algo1+an1+alg1+sm1+elec1+ll+eng)/18;


// S2
let asd2 = calc3(asdCours.value, asdTd.value, asdTp.value) * 5;
let an2 = calc3(anCours.value, anTd.value, 0) * 4;
let alg2 = calc3(algCours.value, algTd.value, 0) * 2;
let sm2 = calc3(smCours.value, smTd.value, 0) * 3;
let elec2 = calc3(elecCours.value, elecTd.value, 0) * 2;
let log2 = calc3(logCours.value, logTd.value, 0) * 1;
let ai2 = calc3(aiCours.value, 0, aiTp.value) * 1;

let moyS2 = (asd2+an2+alg2+sm2+elec2+log2+ai2)/18;


// final
let moy = (moyS1 + moyS2)/2;

result.innerHTML =
"S1: " + moyS1.toFixed(2) + "<br>" +
"S2: " + moyS2.toFixed(2) + "<br>" +
"Final: " + moy.toFixed(2);

}

// ================= SAVE =================
function saveData(){
    let inputs = document.querySelectorAll("input");
    inputs.forEach(i=>{
        localStorage.setItem(i.id, i.value);
    });
    alert("Saved!");
}

// ================= LOAD =================
function loadData(){
    let inputs = document.querySelectorAll("input");
    inputs.forEach(i=>{
        i.value = localStorage.getItem(i.id) || "";
    });
}

window.onload = loadData;

</script>

</body>
</html>
