<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moyenne Annuelle</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    color:#00bfff;
}

.box{
    background:#1e1e1e;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

h2{
    color:#00ffcc;
}

h3{
    color:#ffd700;
    text-align:center;
    margin-bottom:15px;
}

input{
    width:90px;
    padding:8px;
    margin:5px;
    border:none;
    border-radius:8px;
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00bfff;
    color:white;
    font-size:20px;
    cursor:pointer;
}

button:hover{
    background:#0099cc;
}

#result{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    color:#00ff99;
    line-height:1.8;
}
</style>
</head>

<body>

<h1>Moyenne Annuelle</h1>

<!-- ================= S1 ================= -->
<div class="box">
<h3>Semestre 1 (S1)</h3>

<h2>Algorithmique 1</h2>
<input id="algo1Cours" placeholder="Cours">
<input id="algo1Td" placeholder="TD">
<input id="algo1Tp" placeholder="TP">

<h2>Analyse 1</h2>
<input id="an1Cours" placeholder="Cours">
<input id="an1Td" placeholder="TD">

<h2>Algèbre 1</h2>
<input id="alg1Cours" placeholder="Cours">
<input id="alg1Td" placeholder="TD">

<h2>SM1</h2>
<input id="sm1Cours" placeholder="Cours">
<input id="sm1Td" placeholder="TD">

<h2>Electricité</h2>
<input id="elec1Cours" placeholder="Cours">
<input id="elec1Td" placeholder="TD">

<h2>Logiciels Libres</h2>
<input id="llCours" placeholder="Cours">

<h2>English</h2>
<input id="engCours" placeholder="Cours">

</div>

<!-- ================= S2 ================= -->
<div class="box">
<h3>Semestre 2 (S2)</h3>

<h2>ASD 2</h2>
<input id="asdCours" placeholder="Cours">
<input id="asdTd" placeholder="TD">
<input id="asdTp" placeholder="TP">

<h2>Analyse 2</h2>
<input id="anCours" placeholder="Cours">
<input id="anTd" placeholder="TD">

<h2>Algèbre 2</h2>
<input id="algCours" placeholder="Cours">
<input id="algTd" placeholder="TD">

<h2>SM2</h2>
<input id="smCours" placeholder="Cours">
<input id="smTd" placeholder="TD">

<h2>Électronique</h2>
<input id="elecCours" placeholder="Cours">
<input id="elecTd" placeholder="TD">

<h2>Logique Math</h2>
<input id="logCours" placeholder="Cours">
<input id="logTd" placeholder="TD">

<h2>AI</h2>
<input id="aiCours" placeholder="Cours">
<input id="aiTp" placeholder="TP">

</div>

<button onclick="calculer()">Calculer</button>

<div id="result"></div>

<script>
function calculer(){

// ================= S1 =================

let algo1 = ((parseFloat(algo1Cours.value)||0)*0.6 + ((parseFloat(algo1Td.value)||0 + parseFloat(algo1Tp.value)||0)/2)*0.4);
let an1 = ((parseFloat(an1Cours.value)||0)*0.6 + (parseFloat(an1Td.value)||0)*0.4);
let alg1 = ((parseFloat(alg1Cours.value)||0)*0.6 + (parseFloat(alg1Td.value)||0)*0.4);
let sm1 = ((parseFloat(sm1Cours.value)||0)*0.6 + (parseFloat(sm1Td.value)||0)*0.4);
let elec1 = ((parseFloat(elec1Cours.value)||0)*0.6 + (parseFloat(elec1Td.value)||0)*0.4);
let ll = (parseFloat(llCours.value)||0);
let eng = (parseFloat(engCours.value)||0);

let totalS1 =
(algo1*5)+(an1*4)+(alg1*2)+(sm1*3)+(elec1*2)+(ll*1)+(eng*1);

let coefS1 = 18;

let moyS1 = totalS1 / coefS1;


// ================= S2 =================

let asd = ((parseFloat(asdCours.value)||0)*0.6 + ((parseFloat(asdTd.value)||0 + parseFloat(asdTp.value)||0)/2)*0.4);
let an2 = ((parseFloat(anCours.value)||0)*0.6 + (parseFloat(anTd.value)||0)*0.4);
let alg2 = ((parseFloat(algCours.value)||0)*0.6 + (parseFloat(algTd.value)||0)*0.4);
let sm2 = ((parseFloat(smCours.value)||0)*0.6 + (parseFloat(smTd.value)||0)*0.4);
let elec2 = ((parseFloat(elecCours.value)||0)*0.6 + (parseFloat(elecTd.value)||0)*0.4);
let log = ((parseFloat(logCours.value)||0)*0.6 + (parseFloat(logTd.value)||0)*0.4);
let ai = ((parseFloat(aiCours.value)||0)*0.6 + (parseFloat(aiTp.value)||0)*0.4);

let totalS2 =
(asd*5)+(an2*4)+(alg2*2)+(sm2*3)+(elec2*2)+(log*1)+(ai*1);

let coefS2 = 18;

let moyS2 = totalS2 / coefS2;


// ================= FINAL =================

let moyAnnuelle = (moyS1 + moyS2) / 2;

result.innerHTML =
"📘 Moyenne S1 : " + moyS1.toFixed(2) + "<br>" +
"📗 Moyenne S2 : " + moyS2.toFixed(2) + "<br><br>" +
"⭐ Moyenne Annuelle : " + moyAnnuelle.toFixed(2);

}
</script>

</body>
</html>
