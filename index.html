<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moyenne Pro</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    color:#00bfff;
}

.box{
    background:#1e1e1e;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

h2{
    color:#00ffcc;
}

h3{
    text-align:center;
    color:#ffd700;
}

.row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
}

label{
    width:60px;
}

input{
    width:70px;
    padding:6px;
    border-radius:6px;
    border:none;
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00bfff;
    color:white;
    font-size:18px;
    margin-top:10px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    line-height:1.8;
}
</style>
</head>

<body>

<h1>Moyenne Universitaire</h1>

<!-- S1 -->
<div class="box">
<h3>S1</h3>

<h2>Algorithmique 1</h2>
<div class="row">
<label>C</label><input id="a1c">
<label>TD</label><input id="a1t">
<label>TP</label><input id="a1p">
</div>

<h2>Analyse 1</h2>
<div class="row">
<label>C</label><input id="an1c">
<label>TD</label><input id="an1t">
</div>

<h2>Algèbre 1</h2>
<div class="row">
<label>C</label><input id="al1c">
<label>TD</label><input id="al1t">
</div>

<h2>SM1</h2>
<div class="row">
<label>C</label><input id="sm1c">
<label>TD</label><input id="sm1t">
</div>

<h2>Électricité</h2>
<div class="row">
<label>C</label><input id="el1c">
<label>TD</label><input id="el1t">
</div>

<h2>Logiciels Libres</h2>
<div class="row">
<label>C</label><input id="llc">
</div>

<h2>English</h2>
<div class="row">
<label>C</label><input id="enc">
</div>

</div>

<!-- S2 -->
<div class="box">
<h3>S2</h3>

<h2>ASD 2</h2>
<div class="row">
<label>C</label><input id="a2c">
<label>TD</label><input id="a2t">
<label>TP</label><input id="a2p">
</div>

<h2>Analyse 2</h2>
<div class="row">
<label>C</label><input id="an2c">
<label>TD</label><input id="an2t">
</div>

<h2>Algèbre 2</h2>
<div class="row">
<label>C</label><input id="al2c">
<label>TD</label><input id="al2t">
</div>

<h2>SM2</h2>
<div class="row">
<label>C</label><input id="sm2c">
<label>TD</label><input id="sm2t">
</div>

<h2>Électronique</h2>
<div class="row">
<label>C</label><input id="el2c">
<label>TD</label><input id="el2t">
</div>

<h2>Logique</h2>
<div class="row">
<label>C</label><input id="logc">
<label>TD</label><input id="logt">
</div>

<h2>AI</h2>
<div class="row">
<label>C</label><input id="aic">
<label>TP</label><input id="aip">
</div>

</div>

<button onclick="calc()">Calculer</button>
<button onclick="save()">💾 Save</button>
<button onclick="load()">📂 Load</button>

<div id="result"></div>

<script>

function m3(c,t,p){
c=parseFloat(c)||0;
t=parseFloat(t)||0;
p=parseFloat(p)||0;

if(p && t){
return c*0.6 + t*0.2 + p*0.2;
}
if(p && !t){
return c*0.6 + p*0.4;
}
return c*0.6 + t*0.4;
}

function calc(){

let s1 =
(m3(a1c.value,a1t.value,a1p.value)*5)+
(m3(an1c.value,an1t.value,0)*4)+
(m3(al1c.value,al1t.value,0)*2)+
(m3(sm1c.value,sm1t.value,0)*3)+
(m3(el1c.value,el1t.value,0)*2)+
(llc.value*1)+
(enc.value*1);

let moy1 = s1/18;

let s2 =
(m3(a2c.value,a2t.value,a2p.value)*5)+
(m3(an2c.value,an2t.value,0)*4)+
(m3(al2c.value,al2t.value,0)*2)+
(m3(sm2c.value,sm2t.value,0)*3)+
(m3(el2c.value,el2t.value,0)*2)+
(m3(logc.value,logt.value,0)*1)+
(m3(aic.value,0,aip.value)*1);

let moy2 = s2/18;

let moy = (moy1 + moy2)/2;

let msg = "";

if(moy >= 10){
msg = "🎉 Réussi";
}else{
msg = "❌ Échoué";
}

result.innerHTML =
"S1: " + moy1.toFixed(2) + "<br>" +
"S2: " + moy2.toFixed(2) + "<br>" +
"Final: " + moy.toFixed(2) + "<br><br>" +
msg;

}

// SAVE
function save(){
let inputs = document.querySelectorAll("input");
inputs.forEach(i=>{
localStorage.setItem(i.id, i.value);
});
alert("Saved ✔");
}

// LOAD
function load(){
let inputs = document.querySelectorAll("input");
inputs.forEach(i=>{
i.value = localStorage.getItem(i.id) || "";
});
}

window.onload = load;

</script>

</body>
</html>
